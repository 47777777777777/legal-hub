<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legal Hub - 法律法規檢索與條文研析</title>
  <meta name="description" content="簡潔純粹的台灣法規檢索閱讀平台，具備深度白話條文解讀、思考脈絡流程圖、常見問答、歷次修法理由對照與手機直達鍵盤。">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dialer.css">
</head>
<body>

  <!-- Minimal Top Navigation -->
  <header class="navbar" id="top-navbar">
    <div class="nav-brand">
      <div class="brand-icon">⚖️</div>
      <span class="brand-title">Legal Hub</span>
    </div>
    
    <div class="nav-controls">
      <select id="act-select" class="act-select" aria-label="選擇法規">
        <option value="criminal_code">中華民國刑法</option>
        <option value="civil_code">中華民國民法</option>
        <option value="constitution">中華民國憲法</option>
        <option value="labor_standards_act">勞動基準法</option>
        <option value="admin_procedure_act">行政程序法</option>
        <option value="traffic_act">道路交通管理處罰條例</option>
        <option value="company_act">公司法</option>
      </select>
      <input type="text" id="act-search-input" class="act-search-input" placeholder="🔍 搜尋全國法規..." aria-label="搜尋全國法規" />
      <button id="dialer-toggle-btn" class="dialer-toggle-btn" title="手機條號直達">🔢 條號直達</button>
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="切換深淺主題">☀️ 淺色</button>
    </div>
  </header>

  <!-- Act Header (Clean LawPlayer Style) -->
  <section class="act-banner" id="act-banner">
    <!-- Populated dynamically -->
  </section>

  <!-- Main Content Layout (Split Screen) -->
  <main class="main-container">
    <!-- Sidebar: Chapters (編章節) -->
    <aside class="sidebar" id="sidebar-toc">
      <h3 class="sidebar-title">📑 編章節目錄</h3>
      <div id="sidebar-chapter-list"></div>
    </aside>

    <!-- Center Content: Articles Feed -->
    <section class="content-area">
      <div class="search-bar-wrapper">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="🔍 快速搜尋條號（如 185-3、184）或條文關鍵字..." 
          aria-label="搜尋條文"
        />
        <button id="search-btn" class="search-btn">搜尋</button>
      </div>

      <!-- Quick Jump Pills (1) (2) (184) ... -->
      <div class="quick-pills-bar" id="quick-pills-bar">
        <span class="pill-label">條號：</span>
        <div id="pills-container" style="display:inline-flex;gap:0.35rem;flex-wrap:wrap;"></div>
      </div>

      <!-- Articles Container -->
      <div id="articles-container"></div>
    </section>

    <!-- Right Side: Clean LawPlayer Reading Drawer -->
    <aside class="lawplayer-drawer hidden" id="lawplayer-drawer" aria-label="條文研析">
      <div class="drawer-header">
        <div class="drawer-top-row">
          <div class="breadcrumbs" id="drawer-breadcrumbs">中華民國刑法 > 第一編 總則 > 第一章 法例</div>
          <button class="drawer-close-btn" id="drawer-close-btn" title="關閉">✕</button>
        </div>

        <h2 class="drawer-title" id="drawer-title">中華民國刑法 第 1 條</h2>
        <div class="drawer-subtitle" id="drawer-subtitle">罪刑法定原則</div>

        <div class="drawer-article-text" id="drawer-article-text">
          <!-- Article full text -->
        </div>

        <!-- LawPlayer Tabs: 關鍵知識 | 內容連結 | 立法理由 | 共同筆記 -->
        <nav class="drawer-tabs" id="drawer-tabs">
          <button class="drawer-tab active" data-tab="key_knowledge">關鍵知識</button>
          <button class="drawer-tab" data-tab="content_links">內容連結 <span class="tab-count-badge" id="links-count-badge">3</span></button>
          <button class="drawer-tab" data-tab="legislative_history">立法理由</button>
          <button class="drawer-tab" data-tab="notes">共同筆記</button>
        </nav>
      </div>

      <!-- Drawer Scrollable Content Body -->
      <div class="drawer-content" id="drawer-content">
        <!-- Rendered dynamically -->
      </div>

      <!-- Drawer Sticky Footer -->
      <footer class="drawer-footer">
        <button class="nav-arrow-btn" id="drawer-prev-btn">← 上一條</button>
        <span class="drawer-curr-nav" id="drawer-curr-nav">第 1 條 罪刑法定原則</span>
        <button class="nav-arrow-btn" id="drawer-next-btn">下一條 →</button>
      </footer>
    </aside>
  </main>

  <!-- Mobile-Only 0-9 Floating Numeric Keypad (Completely hidden on desktop) -->
  <div id="quick-dialer" class="quick-dialer-container hidden" role="dialog" aria-label="手機條號直達數字鍵盤">
    <div class="dialer-header">
      <div class="dialer-preview">
        <span class="dialer-label">📱 手機條號直達：</span>
        <span id="dialer-display" class="dialer-display">請輸入條號</span>
      </div>
      <div class="dialer-actions">
        <button class="dialer-btn-close" id="dialer-close-btn" title="收起鍵盤">✕</button>
      </div>
    </div>
    
    <div class="dialer-grid">
      <button class="dialer-key" data-val="1">1</button>
      <button class="dialer-key" data-val="2">2</button>
      <button class="dialer-key" data-val="3">3</button>
      <button class="dialer-key" data-val="4">4</button>
      <button class="dialer-key" data-val="5">5</button>
      <button class="dialer-key" data-val="6">6</button>
      <button class="dialer-key" data-val="7">7</button>
      <button class="dialer-key" data-val="8">8</button>
      <button class="dialer-key" data-val="9">9</button>
      <button class="dialer-key" data-val="0">0</button>
      <button class="dialer-key key-dash" data-val="-" title="之 (例: 185-3)">-</button>
      <button class="dialer-key key-backspace" data-val="backspace" title="退格">⌫</button>
      <button class="dialer-key key-go" data-val="go" title="立即跳轉">GO</button>
    </div>
  </div>

  <!-- Mobile Floating Action Button (FAB) - Hidden on desktop via CSS -->
  <button id="dialer-fab" class="dialer-fab" title="開啟手機 0-9 條號鍵盤">
    🔢
  </button>

  <script src="/js/dialer.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
