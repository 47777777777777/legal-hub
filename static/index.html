<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legal Hub - 專業法規閱讀與條文深度研析</title>
  <meta name="description" content="符合人體工學的現代法律檢索與深度研析平台，單一自然滾動排版，收錄全條文白話解析、實務判解、內容連結與歷次修法理由。">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dialer.css">
</head>
<body>

  <!-- Minimal Ergonomic Header -->
  <header class="navbar" id="top-navbar">
    <div class="nav-brand">
      <div class="brand-icon">⚖️</div>
      <span class="brand-title">Legal Hub</span>
    </div>
    
    <div class="nav-controls">
      <select id="act-select" class="act-select" aria-label="選擇法規">
        <option value="criminal_code">中華民國刑法</option>
        <option value="civil_code">中華民國民法</option>
        <option value="constitution">中華民國憲法</option>
        <option value="labor_standards_act">勞動基準法</option>
        <option value="admin_procedure_act">行政程序法</option>
        <option value="traffic_act">道路交通管理處罰條例</option>
        <option value="company_act">公司法</option>
      </select>
      <input type="text" id="act-search-input" class="act-search-input" placeholder="🔍 搜尋全國法規..." aria-label="搜尋全國法規" />
      <button id="dialer-toggle-btn" class="dialer-toggle-btn" title="手機條號直達">🔢 條號直達</button>
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="切換深淺主題">☀️ 淺色</button>
    </div>
  </header>

  <!-- Act Meta Bar -->
  <section class="act-banner" id="act-banner">
    <!-- Populated dynamically -->
  </section>

  <!-- Ergonomic Workspace Layout -->
  <main class="workspace-container">
    <!-- Left Col 1: Chapter Outline (Desktop only, 220px) -->
    <aside class="sidebar-toc" id="sidebar-toc">
      <h3 class="panel-heading">📑 編章節索引</h3>
      <div id="sidebar-chapter-list"></div>
    </aside>

    <!-- Center Main Area: Continuous Statute Stream Reader (全條文連續流暢閱讀) -->
    <section class="statute-stream-container" id="statute-stream-container">
      <div class="stream-toolbar">
        <div class="stream-search-wrapper">
          <input type="text" id="search-input" class="search-input" placeholder="🔍 搜尋本法規條號（如 1、184、185-3）或條文關鍵字..." aria-label="搜尋條文" />
        </div>
        <div class="stream-stats" id="stream-stats"></div>
      </div>
      
      <!-- Continuous list of all articles with full text -->
      <div class="statute-stream-list" id="statute-stream-list">
        <!-- Rendered articles in sequence with full text & 條文研析 action -->
      </div>
    </section>

    <!-- Slide-Over Deep Study Drawer (Desktop side drawer / Mobile full sheet) -->
    <!-- SINGLE UNIFIED VERTICAL SCROLL CONTAINER: No nested scrollbars! -->
    <aside class="study-drawer hidden" id="study-drawer" aria-label="條文深度研析面板">
      <div class="study-drawer-backdrop" id="drawer-backdrop"></div>
      <div class="study-drawer-panel" id="study-drawer-panel">
        <div class="study-drawer-header">
          <div class="drawer-header-left">
            <span class="drawer-breadcrumb" id="drawer-breadcrumb">中華民國刑法 > 第一章 法例</span>
            <span class="drawer-article-badge" id="drawer-article-badge">第 1 條</span>
          </div>
          <div class="drawer-header-actions">
            <button class="drawer-tool-btn" id="drawer-expand-btn" title="切換寬度">⛶ 展開</button>
            <button class="drawer-close-btn" id="drawer-close-btn" title="關閉 (Esc)">✕</button>
          </div>
        </div>

        <!-- Single vertical scroll body: Everything flows inside naturally! -->
        <div class="study-drawer-scroll-body" id="study-drawer-scroll-body">
          <!-- Populated dynamically: Article text, Sticky tabs, All tab content, Bottom nav -->
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile-Only 0-9 Floating Numeric Keypad -->
  <div id="quick-dialer" class="quick-dialer-container hidden" role="dialog" aria-label="手機條號直達數字鍵盤">
    <div class="dialer-header">
      <div class="dialer-preview">
        <span class="dialer-label">📱 條號直達：</span>
        <span id="dialer-display" class="dialer-display">請輸入條號</span>
      </div>
      <div class="dialer-actions">
        <button class="dialer-btn-close" id="dialer-close-btn" title="收起鍵盤">✕</button>
      </div>
    </div>
    
    <div class="dialer-grid">
      <button class="dialer-key" data-val="1">1</button>
      <button class="dialer-key" data-val="2">2</button>
      <button class="dialer-key" data-val="3">3</button>
      <button class="dialer-key" data-val="4">4</button>
      <button class="dialer-key" data-val="5">5</button>
      <button class="dialer-key" data-val="6">6</button>
      <button class="dialer-key" data-val="7">7</button>
      <button class="dialer-key" data-val="8">8</button>
      <button class="dialer-key" data-val="9">9</button>
      <button class="dialer-key dialer-key-action" data-val="-">之 (-)</button>
      <button class="dialer-key" data-val="0">0</button>
      <button class="dialer-key dialer-key-action" data-val="back">⌫ 刪除</button>
    </div>

    <div class="dialer-footer">
      <button class="dialer-jump-btn" id="dialer-jump-btn">⚡ 立即前往條文</button>
    </div>
  </div>

  <script src="/js/dialer.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
