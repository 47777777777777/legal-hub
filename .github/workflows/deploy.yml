name: Deploy to Oracle Cloud Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 161.33.166.144
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo ">>> Pulling latest code on 161.33.166.144..."
            cd ~/legal-hub
            git pull origin main
            
            echo ">>> Running guardrail integrity checks..."
            python3 scripts/verify_integrity.py
            
            echo ">>> Restarting legal-hub.service..."
            sudo systemctl restart legal-hub.service
            
            echo ">>> Checking service status..."
            sudo systemctl is-active legal-hub.service
            echo ">>> Deployment successful!"
